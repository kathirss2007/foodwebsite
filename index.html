
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QuickBite Food Delivery</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- ================================================= -->
<!-- LOGIN PAGE -->
<!-- ================================================= -->

<div id="loginPage">

    <div class="login-box">

        <div class="login-logo">
            🍽️
        </div>

        <h1>
            QuickBite
        </h1>

        <p>
            Login to order your favourite food
        </p>


        <input
            type="text"
            id="username"
            placeholder="Enter Username">


        <input
            type="password"
            id="password"
            placeholder="Enter Password">


        <button
            class="login-btn"
            onclick="login()">

            Login

        </button>


        <div id="loginMessage"></div>

    </div>

</div>



<!-- ================================================= -->
<!-- MAIN WEBSITE -->
<!-- ================================================= -->

<div id="mainPage">


<!-- HEADER -->

<header class="navbar">

    <div class="logo">
        🍽️ QuickBite
    </div>


    <div class="nav-buttons">

        <button
            class="cart-btn"
            onclick="showCart()">

            🛒 Cart
            (<span id="cartCount">0</span>)

        </button>


        <button
            class="logout-btn"
            onclick="logout()">

            Logout

        </button>

    </div>

</header>



<!-- HERO -->

<section class="hero">

    <h1>
        Delicious Food, Delivered Fast
    </h1>

    <p>
        Search your favourite food
    </p>


    <input
        type="text"
        class="search"
        id="searchBox"

        placeholder="Search Pizza, Biryani, Burger..."

        oninput="searchFood()">

</section>



<!-- FOOD SECTION -->

<section class="food-section">

    <h2>
        🍴 Popular Foods
    </h2>

    <p>
        Select your favourite food and add it to cart
    </p>


    <div
        class="food-grid"
        id="foodList">

    </div>

</section>



<!-- CART -->

<section id="cartBox">

    <h2>
        🛒 Your Cart
    </h2>


    <div id="cartItems">

    </div>


    <div class="total">

        Total: ₹
        <span id="totalPrice">
            0
        </span>

    </div>


    <!-- PAYMENT -->

    <div class="payment">

        <h3>
            💳 Payment Method
        </h3>


        <label>

            <input
                type="radio"
                name="payment"
                value="UPI">

            📱 UPI
            (GPay / PhonePe / Paytm)

        </label>


        <label>

            <input
                type="radio"
                name="payment"
                value="Card">

            💳 Credit / Debit Card

        </label>


        <label>

            <input
                type="radio"
                name="payment"
                value="Net Banking">

            🏦 Net Banking

        </label>


        <label>

            <input
                type="radio"
                name="payment"
                value="Cash on Delivery">

            💵 Cash on Delivery

        </label>


        <button
            class="order-btn"
            onclick="placeOrder()">

            Confirm Order

        </button>


        <div id="message"></div>

    </div>

</section>



<footer>

    © 2026 QuickBite
    | Fresh Food Delivery

</footer>

</div>



<script src="script.js"></script>

</body>

</html>
